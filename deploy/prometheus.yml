# Prometheus configuration for iPShadowT monitoring
global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - "alert_rules.yml"

alerting:
  alertmanagers:
    - static_configs:
        - targets: ['alertmanager:9093']

scrape_configs:
  - job_name: 'ipshadowt'
    scrape_interval: 5s
    static_configs:
      - targets: ['host.docker.internal:9091']
        labels:
          instance: 'main'
    # For multiple tunnels, add more targets:
    # - targets: ['host.docker.internal:9092']
    #   labels:
    #     instance: 'tunnel-DE'

  - job_name: 'ipshadowt-health'
    scrape_interval: 10s
    metrics_path: /health
    static_configs:
      - targets: ['host.docker.internal:9090']
