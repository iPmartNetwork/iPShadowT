name: Release

on:
  push:
    tags:
      - 'v*'

env:
  BINARY_NAME: ipshadowt
  GO_VERSION: '1.23'
  AUTHOR: 'iPmart Network (Ali Hassanzadeh)'

jobs:
  # ─── Test ────────────────────────────────────────
  test:
    name: Test Suite
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Download dependencies
        run: go mod download

      - name: Verify dependencies
        run: go mod verify

      - name: Run vet
        run: go vet ./...

      - name: Run tests with race detector
        run: go test -race -v ./core/... ./internal/...

      - name: Run integration tests
        run: go test -v ./tests/...

      - name: Upload coverage
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage.out

  # ─── Build Matrix ───────────────────────────────
  build:
    name: Build ${{ matrix.os }}/${{ matrix.arch }}
    runs-on: ubuntu-latest
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: linux
            arch: amd64
            suffix: linux-amd64
          - os: linux
            arch: arm64
            suffix: linux-arm64
          - os: linux
            arch: arm
            goarm: '7'
            suffix: linux-armv7
          - os: linux
            arch: mips
            gomips: softfloat
            suffix: linux-mips-softfloat
          - os: linux
            arch: mipsle
            gomips: softfloat
            suffix: linux-mipsle-softfloat
          - os: windows
            arch: amd64
            suffix: windows-amd64.exe
          - os: windows
            arch: arm64
            suffix: windows-arm64.exe
          - os: darwin
            arch: amd64
            suffix: darwin-amd64
          - os: darwin
            arch: arm64
            suffix: darwin-arm64
          - os: freebsd
            arch: amd64
            suffix: freebsd-amd64

    steps:
      - uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Get version info
        id: version
        run: |
          echo "version=${{ github.ref_name }}" >> $GITHUB_OUTPUT
          echo "commit=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT
          echo "date=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> $GITHUB_OUTPUT

      - name: Build binary
        env:
          CGO_ENABLED: '0'
          GOOS: ${{ matrix.os }}
          GOARCH: ${{ matrix.arch }}
          GOARM: ${{ matrix.goarm }}
          GOMIPS: ${{ matrix.gomips }}
        run: |
          LDFLAGS="-s -w"
          LDFLAGS="$LDFLAGS -X main.Version=${{ steps.version.outputs.version }}"
          LDFLAGS="$LDFLAGS -X main.Commit=${{ steps.version.outputs.commit }}"
          LDFLAGS="$LDFLAGS -X main.BuildTime=${{ steps.version.outputs.date }}"
          LDFLAGS="$LDFLAGS -X 'main.Author=${{ env.AUTHOR }}'"

          go build -trimpath -ldflags "$LDFLAGS" \
            -o ${{ env.BINARY_NAME }}-${{ matrix.suffix }} \
            ./cmd/ipshadowt/

      - name: Compress binary (UPX) — Linux/Windows only
        if: matrix.os != 'darwin' && matrix.arch == 'amd64'
        run: |
          sudo apt-get install -y upx-ucl 2>/dev/null || true
          upx --best --lzma ${{ env.BINARY_NAME }}-${{ matrix.suffix }} 2>/dev/null || true

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.BINARY_NAME }}-${{ matrix.suffix }}
          path: ${{ env.BINARY_NAME }}-${{ matrix.suffix }}
          retention-days: 1

  # ─── Docker ─────────────────────────────────────
  docker:
    name: Docker Image
    runs-on: ubuntu-latest
    needs: test
    permissions:
      packages: write
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=raw,value=latest

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ─── Release ────────────────────────────────────
  release:
    name: Create Release
    runs-on: ubuntu-latest
    needs: [build, docker]
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Prepare release assets
        run: |
          mkdir -p release
          find artifacts -type f -name "${{ env.BINARY_NAME }}-*" -exec mv {} release/ \;
          
          # Copy deploy script
          cp deploy/ipshadowt-manager.sh release/
          chmod +x release/ipshadowt-manager.sh

          # Copy example configs
          tar -czf release/configs-examples.tar.gz configs/

          # Copy monitoring stack
          tar -czf release/monitoring-stack.tar.gz \
            deploy/docker-compose.monitoring.yml \
            deploy/prometheus.yml \
            deploy/alert_rules.yml

      - name: Generate checksums
        working-directory: release
        run: |
          sha256sum * > SHA256SUMS.txt
          md5sum * > MD5SUMS.txt

      - name: Generate changelog since last tag
        id: changelog
        run: |
          PREV_TAG=$(git tag --sort=-version:refname | head -2 | tail -1)
          if [ -z "$PREV_TAG" ]; then
            PREV_TAG=$(git rev-list --max-parents=0 HEAD)
          fi
          echo "## Changes since ${PREV_TAG}" > GENERATED_CHANGELOG.md
          echo "" >> GENERATED_CHANGELOG.md
          git log --pretty=format:"- %s (%h)" ${PREV_TAG}..HEAD >> GENERATED_CHANGELOG.md

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release/*
          body_path: RELEASE_NOTES.md
          draft: false
          prerelease: ${{ contains(github.ref_name, 'rc') || contains(github.ref_name, 'beta') || contains(github.ref_name, 'alpha') }}
          generate_release_notes: true
          append_body: true

  # ─── Notify ─────────────────────────────────────
  notify:
    name: Post-Release
    runs-on: ubuntu-latest
    needs: release
    if: success()
    steps:
      - name: Release summary
        run: |
          echo "✅ Release ${{ github.ref_name }} published successfully!"
          echo ""
          echo "📦 Artifacts:"
          echo "  - Linux: amd64, arm64, armv7, mips, mipsle"
          echo "  - Windows: amd64, arm64"
          echo "  - macOS: amd64 (Intel), arm64 (Apple Silicon)"
          echo "  - FreeBSD: amd64"
          echo "  - Docker: ghcr.io/${{ github.repository }}:${{ github.ref_name }}"
          echo ""
          echo "🔗 https://github.com/${{ github.repository }}/releases/tag/${{ github.ref_name }}"
